<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F7F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1110" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="An open Greek library, carefully translated and deeply connected. Explore the Iliad research bounties.">
<title>GreekIndexBounty</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<a class="skip-link" href="#" onclick="event.preventDefault(); document.getElementById('view').focus();">Skip to content</a>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Sections"></aside>
  <div class="stage">
    <header class="navbar" id="navbar">
      <div class="navbar-inner">
        <div class="nav-left" id="nav-left"></div>
        <div class="nav-title" id="nav-title"></div>
        <div class="nav-right" id="nav-right"></div>
      </div>
    </header>
    <main class="view-host" id="view" tabindex="-1"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
</div>
<div class="sheet-host" id="sheets"></div>
<div class="toast-host" id="toasts" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">GreekIndexBounty needs JavaScript to run.</p></noscript>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
