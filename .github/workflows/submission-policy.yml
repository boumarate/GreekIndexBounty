name: Submission policy
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
jobs:
  policy:
    name: Submission policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only trusted base-branch code is executed. Proposed content is read as data.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: proposed
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate the proposed data using the base policy and validator
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node trusted/scripts/validate.mjs --root proposed --base "$BASE_SHA"
